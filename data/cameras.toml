# RAWmakase's camera table: per-model values that are not in the raw file itself.
# See docs/cameras.md for what each field means and how to add a camera.
#
# make and model are the names LibRaw reports (raw-identify -v prints them as
# "Normalized Make/Model"); aliases are other model names for the same body.
# baseline_exposure is the exposure, in EV, Camera Raw adds to an unedited photo
# with Adobe Standard. source says where the value comes from:
#   adobe-dng      read from a DNG Adobe software wrote: BaselineExposure, plus the
#                  white-level difference to LibRaw (see docs/cameras.md)
#   adobe-profile  read from the camera's Adobe DCP (BaselineExposureOffset tag)
#   fitted         fitted to Camera Raw renders (median midtone offset)
#   measured       measured by hand; say how in `how`
# checked is the date of the check and sample what it was checked on.
# Values hold at standard settings (no Highlight Tone Priority, DR100, no extended
# low ISO). RAWmakase moves Fujifilm rows with the raw's exposure midpoint shift
# (DR200/DR400, extended ISO) unless the row says fujifilm_exposure_shift = "ignored";
# fujifilm_dr100_shift gives the body's shift at DR100 when it is not the sensor's
# usual one (-0.72 X-Trans, 0 Bayer).

[[camera]]
make = "Canon"
model = "EOS 200D"
neutral_calibration = [1.0247, 1.0, 1.026]
baseline_exposure = 0.5
source = "adobe-dng"
checked = "2026-10-05"
sample = "raw.pixls.us, 1 photo at ISO 100; BaselineExposure +0.00 plus +0.48 for the white level"

